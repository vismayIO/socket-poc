# NATS Server Configuration with Auth Callout

# WebSocket listener
websocket {
    port: 8080
    no_tls: true
}

# Define accounts
accounts {
    # AUTH account - for the auth callout service
    AUTH {
        users: [
            { user: auth, password: auth }
        ]
    }
    # APP account - for authenticated application users
    APP {
        users: [
            # Internal API service user for backend services
            { user: api_service, password: api_service_secret }
        ]
    }
    # SYS account - for system/admin users
    SYS {
        users: [
            { user: sys, password: sys_secret }
        ]
    }
}

# System account for monitoring
system_account: SYS

# Auth callout configuration
authorization {
    auth_callout {
        # The issuer is the public key of the account that signs auth responses
        issuer: ABM3POLTSVDRBDYBGJZXGXZFYHLCS5NIJOVUHBU7WJOFK66BG4C5HH5J
        
        # Users that bypass auth_callout and use direct credential auth
        # - auth: the auth callout service itself
        # - api_service: internal API backend service
        users: [ auth, api_service ]
        
        # Account the auth service belongs to
        account: AUTH
    }
}